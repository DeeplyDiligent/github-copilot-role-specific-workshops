<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Display</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>Your QR Code</h1>

        <a href="{{ url_for('main.input_text') }}" class="btn">Generate Another QR Code</a>
    </div>
</body>
</html>
